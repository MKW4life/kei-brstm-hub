<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Kei Projects">
  <title>Kei Projects</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./projects-config.js"></script>
  <script defer src="./site.js"></script>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Kei Projects ホーム">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span>Kei Projects</span>
      </a>
    </header>

    <main id="main">
      <h1>Kei Projects</h1>
      <div class="projects">
        <section class="project-card" aria-labelledby="music-title">
          <span class="project-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="18" cy="16" rx="3" ry="2"/></svg>
          </span>
          <h2 id="music-title">Kei BRSTM Hub</h2>
          <a class="action" href="/music">
            BRSTMを探す <span aria-hidden="true">↗</span>
          </a>
        </section>

        <section class="project-card" aria-labelledby="lounge-title">
          <span class="project-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.3" cy="10" r="2"/><path d="M5.8 16c.4-2.1 4.5-2.1 4.9 0M14 9h5M14 13h5M14 17h3"/></svg>
          </span>
          <h2 id="lounge-title">Kei Lounge Card</h2>
          <div class="actions">
            <a class="action" href="/lounge">
              ラウンジカードを開く <span aria-hidden="true">↗</span>
            </a>
            <a class="action action-secondary" href="/lounge/item-counter">
              Item Counterを開く <span aria-hidden="true">↗</span>
            </a>
          </div>
        </section>

        <section class="project-card" id="stats-card" aria-labelledby="stats-title" hidden>
          <span class="project-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V13M10 20V4M16 20v-9M22 20v-5M2 20h20"/></svg>
          </span>
          <h2 id="stats-title">MKW Course Stats</h2>
          <a class="action" id="stats-link" href="#" aria-label="MKW Course Statsを開く">
            コース別成績を見る <span aria-hidden="true">↗</span>
          </a>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
